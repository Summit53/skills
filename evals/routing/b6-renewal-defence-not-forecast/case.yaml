schema_version: "1.1"
name: b6-renewal-defence-not-forecast
description: "Routes to renewal-defence-pack; never cs-renewal-forecast"
tags: ["routing", "near-miss"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "Save plan for Capital Wealth Advisory — their renewal is at risk."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-renewal-defence-pack
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?renewal-defence-pack\""
  - name: never-cs-renewal-forecast
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?cs-renewal-forecast\""
    min: 0
    max: 0
