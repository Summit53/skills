schema_version: "1.1"
name: a16-win-loss-analysis
description: "Routes to win-loss-analysis; never competitor-response-card"
tags: ["routing", "per-skill"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "Why are we losing deals? What separates our wins from our losses?"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-win-loss-analysis
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?win-loss-analysis\""
  - name: never-competitor-response-card
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?competitor-response-card\""
    min: 0
    max: 0
