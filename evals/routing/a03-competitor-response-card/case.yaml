schema_version: "1.1"
name: a03-competitor-response-card
description: "Routes to competitor-response-card; never win-loss-analysis"
tags: ["routing", "per-skill"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "A competitor just showed up in the Oceanic Pharma deal and they're saying they're cheaper. How do I respond?"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-competitor-response-card
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?competitor-response-card\""
  - name: never-win-loss-analysis
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?win-loss-analysis\""
    min: 0
    max: 0
