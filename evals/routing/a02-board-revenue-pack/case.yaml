schema_version: "1.1"
name: a02-board-revenue-pack
description: "Routes to board-revenue-pack"
tags: ["routing", "per-skill"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "I have a board meeting in three weeks. Build my board revenue pack for this quarter."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-board-revenue-pack
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?board-revenue-pack\""
