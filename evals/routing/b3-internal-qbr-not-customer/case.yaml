schema_version: "1.1"
name: b3-internal-qbr-not-customer
description: "Routes to qbr-generator; never customer-qbr"
tags: ["routing", "near-miss"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "Build our quarterly business review deck for the exec team."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-qbr-generator
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?qbr-generator\""
  - name: never-customer-qbr
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?customer-qbr\""
    min: 0
    max: 0
