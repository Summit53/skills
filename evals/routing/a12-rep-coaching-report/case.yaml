schema_version: "1.1"
name: a12-rep-coaching-report
description: "Routes to rep-coaching-report; never rep-evidence-dossier"
tags: ["routing", "per-skill"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "Prep my 1:1 with Rachel Kumar — what should I coach her on?"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-rep-coaching-report
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?rep-coaching-report\""
  - name: never-rep-evidence-dossier
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?rep-evidence-dossier\""
    min: 0
    max: 0
