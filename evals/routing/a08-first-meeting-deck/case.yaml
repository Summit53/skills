schema_version: "1.1"
name: a08-first-meeting-deck
description: "Routes to first-meeting-deck"
tags: ["routing", "per-skill"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "I'm meeting Coral Bay Resources tomorrow for a first discovery call — make me a deck."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-first-meeting-deck
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?first-meeting-deck\""
