schema_version: "1.1"
name: b2-inspection-not-deal-review
description: "Routes to ae-deal-inspection-prep; never deal-review-prep"
tags: ["routing", "near-miss"]
plugins: ["../../../plugins/summit53"]
execution:
  prompt: "Help me answer questions on the Federation Insurance Group deal before my 1:1 with my manager."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: routes-to-ae-deal-inspection-prep
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?ae-deal-inspection-prep\""
  - name: never-deal-review-prep
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:summit53:)?deal-review-prep\""
    min: 0
    max: 0
